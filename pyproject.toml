[build-system]
requires = ["setuptools>=45", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "battery-optimization-greek-electricity-market"
version = "0.1.0"
description = "Battery Optimization in the Greek Electricity Market"
requires-python = ">=3.11"
dependencies = [
    "torch>=2.0.0",
    "numpy>=1.24.0",
    "pandas>=1.5.0",
    "pybamm>=23.0",
    "matplotlib>=3.7.0",
    "pulp>=2.8.0",
    "openpyxl>=3.1.0",
    "streamlit>=1.32.0",
    "plotly>=5.18.0",
]

[project.scripts]
bess-run-optimization = "bess_optimization.cli.run_engine:main"
bess-dam-forecast = "bess_optimization.forecasting.dam_15min_forecast:main"
bess-forecast-backtest = "bess_optimization.services.forecast_strategy_backtest:main"
bess-build-prices = "bess_optimization.cli.build_prices:main"

[project.optional-dependencies]
dev = [
    "black>=23.0",
    "ruff>=0.1.0",
]

[tool.setuptools.packages.find]
where = ["src"]
